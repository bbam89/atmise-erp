<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인 가계부</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8FA;--white:#fff;
  --primary:#4263EB;--primary-l:#EEF2FF;
  --green:#12B886;--green-l:#E6FCF5;
  --red:#FA5252;--red-l:#FFF5F5;
  --amber:#F59F00;--amber-l:#FFF9DB;
  --gray1:#F1F3F5;--gray2:#E9ECEF;
  --gray4:#CED4DA;--gray5:#ADB5BD;--gray6:#6C757D;
  --gray7:#495057;--gray8:#343A40;--gray9:#212529;
  --bd:1px solid #E9ECEF;--rad:8px;--radl:14px;
  --sh:0 1px 3px rgba(0,0,0,.06);--shl:0 4px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--gray9);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:var(--white);border-bottom:var(--bd);flex-shrink:0;box-shadow:var(--sh);position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:700}
.tabs{display:flex;gap:2px;background:var(--gray1);border-radius:var(--rad);padding:3px}
.tab{padding:5px 14px;border-radius:6px;font-size:13px;border:none;background:transparent;color:var(--gray6);font-weight:500;transition:all .15s;white-space:nowrap}
.tab.on{background:var(--white);color:var(--gray9);box-shadow:var(--sh)}
.topbar-r{display:flex;align-items:center;gap:10px}
.ss{font-size:11px;color:var(--gray5)}.ss.saving{color:var(--amber)}.ss.err{color:var(--red)}
.btn-add{display:flex;align-items:center;gap:5px;padding:7px 15px;border-radius:var(--rad);font-size:13px;font-weight:500;border:none;background:var(--primary);color:#fff}
.content{flex:1;padding:20px;max-width:900px;width:100%;margin:0 auto}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.sum-card{background:var(--white);border:var(--bd);border-radius:var(--radl);padding:16px 18px;box-shadow:var(--sh)}
.sum-label{font-size:11px;font-weight:700;color:var(--gray5);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.sum-val{font-size:22px;font-weight:700}
.sum-sub{font-size:11px;color:var(--gray5);margin-top:3px}
.sec-title{font-size:13px;font-weight:700;color:var(--gray7);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sec-more{font-size:12px;color:var(--primary);font-weight:500;cursor:pointer;border:none;background:transparent}
.bill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:20px}
.bill-card{background:var(--white);border:var(--bd);border-radius:var(--radl);padding:14px 16px;box-shadow:var(--sh)}
.bill-name{font-size:12px;font-weight:700;color:var(--gray6);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.bill-dot{width:8px;height:8px;border-radius:50%}
.bill-amt{font-size:20px;font-weight:700;color:var(--gray9);margin-bottom:4px}
.bill-info{font-size:11px;color:var(--gray5);margin-bottom:2px}
.dday{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:4px}
.dday.today{background:var(--red);color:#fff}
.dday.soon{background:var(--red-l);color:var(--red)}
.dday.ok{background:var(--green-l);color:var(--green)}
.fixed-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.fixed-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--white);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);cursor:pointer}
.fixed-item:hover{border-color:var(--gray4)}
.cat-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;background:var(--gray1);color:var(--gray7)}
.paid-y{background:var(--green-l);color:var(--green)}
.paid-n{background:var(--red-l);color:var(--red)}
.tx-list{display:flex;flex-direction:column;gap:5px}
.tx-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--white);border:var(--bd);border-radius:var(--rad);cursor:pointer;transition:border-color .15s;box-shadow:var(--sh)}
.tx-item:hover{border-color:var(--gray4)}
.tx-info{flex:1;min-width:0}
.tx-title{font-size:13px;font-weight:500;color:var(--gray8)}
.tx-meta{font-size:11px;color:var(--gray5);margin-top:1px;display:flex;gap:8px}
.tx-amt{font-size:14px;font-weight:700;white-space:nowrap}
.inc{color:var(--green)}.exp{color:var(--red)}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mn-nav{display:flex;align-items:center;gap:6px}
.mn-nav button{background:var(--white);border:var(--bd);border-radius:var(--rad);padding:5px 10px;font-size:13px;color:var(--gray7)}
.mn-lbl{font-size:14px;font-weight:700;min-width:72px;text-align:center}
.fbtns{display:flex;gap:4px}
.fbtn{padding:5px 12px;border-radius:20px;font-size:12px;border:var(--bd);background:var(--white);color:var(--gray6);font-weight:500}
.fbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.sum-bar{display:flex;gap:16px;padding:12px 16px;background:var(--white);border:var(--bd);border-radius:var(--rad);margin-bottom:12px;box-shadow:var(--sh)}
.sb-item{font-size:12px;color:var(--gray6);display:flex;gap:6px;align-items:center}
.sb-item strong{color:var(--gray9)}
.tx-dg{margin-bottom:14px}
.tx-dl{font-size:11px;font-weight:700;color:var(--gray5);letter-spacing:.6px;margin-bottom:6px;padding-left:2px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-card{background:var(--white);border:var(--bd);border-radius:var(--radl);padding:16px;box-shadow:var(--sh)}
.stat-title{font-size:11px;font-weight:700;color:var(--gray5);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-lbl{font-size:12px;color:var(--gray7);width:68px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-wrap{flex:1;height:8px;background:var(--gray2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-val{font-size:11px;color:var(--gray6);width:58px;text-align:right;flex-shrink:0}
.mc{display:flex;align-items:flex-end;gap:6px;height:90px}
.mc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.mc-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.mc-lbl{font-size:9px;color:var(--gray5);margin-top:3px}
.ss-sec{margin-bottom:24px;max-width:520px}
.ss-title{font-size:13px;font-weight:700;color:var(--gray7);margin-bottom:10px;padding-bottom:6px;border-bottom:var(--bd)}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cat-chip{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;font-size:12px;border:var(--bd);background:var(--white);color:var(--gray7);font-weight:500}
.cat-del{background:transparent;border:none;color:var(--gray5);font-size:15px;line-height:1;padding:0 0 0 2px;cursor:pointer}
.cat-del:hover{color:var(--red)}
.cat-add{display:flex;gap:6px}
.pm-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--white);border:var(--bd);border-radius:var(--rad);margin-bottom:6px;cursor:pointer;box-shadow:var(--sh)}
.pm-item:hover{border-color:var(--gray4)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:var(--radl);width:100%;max-width:420px;box-shadow:var(--shl);max-height:90vh;display:flex;flex-direction:column}
.modal-hd{padding:18px 20px 14px;border-bottom:var(--bd);flex-shrink:0}
.modal-hd h3{font-size:15px;font-weight:700}
.modal-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--gray6);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:8px 10px;border:var(--bd);border-radius:var(--rad);font-size:13px;color:var(--gray8);transition:border-color .15s}
.fi:focus{outline:none;border-color:var(--primary)}
.fi::placeholder{color:var(--gray4)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-tog{display:flex;gap:6px}
.type-btn{flex:1;padding:9px;border-radius:var(--rad);font-size:13px;font-weight:600;border:var(--bd);background:var(--white);color:var(--gray6);transition:all .15s}
.type-btn.exp.on{background:var(--red-l);border-color:var(--red);color:var(--red)}
.type-btn.inc.on{background:var(--green-l);border-color:var(--green);color:var(--green)}
.modal-ft{padding:14px 20px;border-top:var(--bd);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-shrink:0}
.btn-del{margin-right:auto;padding:7px 14px;border-radius:var(--rad);font-size:13px;border:1px solid var(--red-l);background:var(--red-l);color:var(--red);font-weight:500}
.btn-cancel{padding:7px 14px;border-radius:var(--rad);font-size:13px;border:var(--bd);background:var(--white);color:var(--gray6);font-weight:500}
.btn-save{padding:7px 18px;border-radius:var(--rad);font-size:13px;border:none;background:var(--primary);color:#fff;font-weight:600}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--primary-l);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--gray5);gap:10px}
.empty{text-align:center;padding:36px 0;color:var(--gray5);font-size:13px}
@media(max-width:768px){
  .sum-grid,.stat-grid{grid-template-columns:1fr}
  .fr2{grid-template-columns:1fr}
  .topbar{padding:0 12px}
  .tab{padding:5px 9px;font-size:11px}
  .content{padding:12px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">💰 개인 가계부</div>
  <div class="tabs">
    <button class="tab on" onclick="go('home')">🏠 홈</button>
    <button class="tab" onclick="go('txlist')">📋 내역</button>
    <button class="tab" onclick="go('stats')">📊 통계</button>
    <button class="tab" onclick="go('fixed')">📌 고정지출</button>
    <button class="tab" onclick="go('settings')">⚙️ 설정</button>
  </div>
  <div class="topbar-r">
    <span class="ss" id="ss">✓ 저장됨</span>
    <button class="btn-add" onclick="openTxModal()">+ 내역추가</button>
  </div>
</div>

<div class="content" id="main">
  <div class="loading"><div class="spin"></div> 불러오는 중...</div>
</div>
<div id="mroot"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTVdje1CQdO8jsX1Lag98cS7bpdJFZzwABCZACZ143Y3tfcOnEyKTa2xCVQtRXhx9X/exec';

// ── 로컬 데이터 ──
const DEFAULT_CATS = {
  expense: ['식비','교통','주거','의류','문화/여가','의료','저축','기타'],
  income:  ['급여','부수입','기타수입']
};
const CARD_COLORS    = ['#4263EB','#12B886','#F59F00','#FA5252','#7950F2','#1C7ED6'];
const ACCOUNT_COLORS = ['#F59F00','#7950F2','#1C7ED6','#2F9E44','#F76707','#E64980'];

function loadLocal(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function saveLocal(k, v)   { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

let CATS     = loadLocal('budget_cats',     DEFAULT_CATS);
let CARDS    = loadLocal('budget_cards',    [{id:'c1',name:'카드1',color:'#4263EB',payDay:15,cutStart:1,cutEnd:0},{id:'c2',name:'카드2',color:'#12B886',payDay:25,cutStart:1,cutEnd:0}]);
let ACCOUNTS = loadLocal('budget_accounts', [{id:'a1',name:'통장1',color:'#F59F00'},{id:'a2',name:'통장2',color:'#7950F2'}]);

// ── 유틸 ──
const T = new Date();
const today = fmt(T);
function fmt(d)    { return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n)     { return String(n).padStart(2,'0'); }
function numFmt(n) { return Number(n||0).toLocaleString(); }
function korDate(ds) { if(!ds) return ''; var p=ds.split('-'); return p[1]+'/'+p[2]; }
function normDate(v) {
  if(!v||v==='') return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  try { var d=new Date(v); if(!isNaN(d)) return fmt(d); } catch(e) {}
  return v;
}

// ── 상태 ──
var S = { view:'home', txs:[], fixed:[], txYear:T.getFullYear(), txMonth:T.getMonth(), txFilter:'all' };

// ── API ──
async function api(action, data) {
  if(!data) data = {};
  setSS('saving');
  try {
    var payload = encodeURIComponent(JSON.stringify(Object.assign({action:action}, data)));
    var r = await fetch(SCRIPT_URL + '?payload=' + payload, {method:'GET', redirect:'follow'});
    var j = await r.json();
    if(j.success !== false) setSS('ok'); else setSS('err');
    return j;
  } catch(e) { setSS('err'); return {success:false}; }
}
function setSS(s) {
  var el = document.getElementById('ss');
  if(s==='saving') { el.textContent='⏳ 저장 중...'; el.className='ss saving'; }
  else if(s==='ok') { el.textContent='✓ 저장됨'; el.className='ss'; }
  else { el.textContent='⚠ 오류'; el.className='ss err'; }
}

async function load() {
  var r = await api('budgetGetAll');
  if(r.success) {
    S.txs   = (r.txs  ||[]).map(function(t){ return Object.assign({},t,{date:normDate(t.date)}); });
    S.fixed = (r.fixed||[]);
    render();
  } else {
    document.getElementById('main').innerHTML = '<div class="empty">⚠️ 데이터 불러오기 실패<br><small>Code.gs를 재배포해주세요</small></div>';
  }
}

// ── 뷰 ──
function go(v) {
  S.view = v;
  var tabs = document.querySelectorAll('.tab');
  var views = ['home','txlist','stats','fixed','settings'];
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', views[i]===v);
  renderMain();
}
function render()     { renderMain(); }
function renderMain() {
  var c = document.getElementById('main');
  if(S.view==='home')     c.innerHTML = buildHome();
  else if(S.view==='txlist')   c.innerHTML = buildTxList();
  else if(S.view==='stats')    c.innerHTML = buildStats();
  else if(S.view==='fixed')    c.innerHTML = buildFixed();
  else if(S.view==='settings') c.innerHTML = buildSettings();
}

// ── 계산 헬퍼 ──
function thisMs() { return T.getFullYear()+'-'+p2(T.getMonth()+1); }
function monthTxs(y,m) { var ms=y+'-'+p2(m+1); return S.txs.filter(function(t){ return t.date && t.date.indexOf(ms)===0; }); }
function sumType(arr,type) { return arr.filter(function(t){ return t.type===type; }).reduce(function(a,t){ return a+Number(t.amount||0); },0); }

function getPmName(cardId) {
  if(!cardId) return '현금';
  var c = CARDS.find(function(x){ return x.id===cardId; });
  if(c) return c.name;
  var a = ACCOUNTS.find(function(x){ return x.id===cardId; });
  if(a) return a.name;
  return '현금';
}
function getPmColor(cardId) {
  if(!cardId) return '#ADB5BD';
  var c = CARDS.find(function(x){ return x.id===cardId; });
  if(c) return c.color;
  var a = ACCOUNTS.find(function(x){ return x.id===cardId; });
  if(a) return a.color;
  return '#ADB5BD';
}

function getCardBill(card) {
  var y=T.getFullYear(), m=T.getMonth();
  var start = new Date(y, m-1, card.cutStart);
  var end   = card.cutEnd===0 ? new Date(y, m+1, 0) : new Date(y, m, card.cutEnd);
  if(end < start) end = new Date(y, m, card.cutEnd);
  var ss=fmt(start), es=fmt(end);
  var amount = S.txs.filter(function(t){ return t.type==='expense' && t.cardId===card.id && t.date>=ss && t.date<=es; })
                    .reduce(function(a,t){ return a+Number(t.amount||0); },0);
  var payDate = new Date(y, m, card.payDay);
  if(payDate < T) payDate = new Date(y, m+1, card.payDay);
  var diff = Math.ceil((payDate-T)/86400000);
  return {amount:amount, ss:ss, es:es, diff:diff};
}

// ── 홈 ──
function buildHome() {
  var ms = thisMs();
  var mt = S.txs.filter(function(t){ return t.date && t.date.indexOf(ms)===0; });
  var inc = sumType(mt,'income'), exp = sumType(mt,'expense'), bal = inc-exp;

  var bills = CARDS.map(function(card) {
    var b = getCardBill(card);
    var dl = b.diff===0 ? '오늘 결제!' : b.diff<0 ? 'D+'+Math.abs(b.diff) : 'D-'+b.diff;
    var dc = b.diff===0 ? 'today' : b.diff<=3 ? 'soon' : 'ok';
    return '<div class="bill-card"><div class="bill-name"><div class="bill-dot" style="background:'+card.color+'"></div>'+card.name+'</div>'
         + '<div class="bill-amt">'+numFmt(b.amount)+'원</div>'
         + '<div class="bill-info">'+korDate(b.ss)+' ~ '+korDate(b.es)+' 사용분</div>'
         + '<div class="bill-info">결제일 매월 '+card.payDay+'일</div>'
         + '<span class="dday '+dc+'">'+dl+'</span></div>';
  }).join('');

  var soon = S.fixed.filter(function(f) {
    var pd = T.getFullYear()+'-'+p2(T.getMonth()+1)+'-'+p2(f.payDay);
    var diff = Math.ceil((new Date(pd)-T)/86400000);
    return diff>=-3 && diff<=7;
  });

  var recent = S.txs.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0,5);

  return '<div class="sum-grid">'
    + '<div class="sum-card"><div class="sum-label">이번달 수입</div><div class="sum-val inc">+'+numFmt(inc)+'원</div><div class="sum-sub">'+(T.getMonth()+1)+'월</div></div>'
    + '<div class="sum-card"><div class="sum-label">이번달 지출</div><div class="sum-val exp">-'+numFmt(exp)+'원</div><div class="sum-sub">'+mt.filter(function(t){return t.type==='expense';}).length+'건</div></div>'
    + '<div class="sum-card"><div class="sum-label">잔액</div><div class="sum-val" style="color:var(--primary)">'+(bal>=0?'+':'')+numFmt(bal)+'원</div><div class="sum-sub">'+(bal>=0?'흑자':'적자')+'</div></div>'
    + '</div>'
    + '<div class="sec-title">💳 카드 청구 예정</div>'
    + '<div class="bill-grid">'+bills+'</div>'
    + (soon.length ? '<div class="sec-title">📌 곧 납부할 고정지출 <button class="sec-more" onclick="go(\'fixed\')">전체보기</button></div><div class="fixed-list">'+soon.map(fixedHTML).join('')+'</div>' : '')
    + '<div class="sec-title">최근 내역 <button class="sec-more" onclick="go(\'txlist\')">전체보기</button></div>'
    + '<div class="tx-list">'+(recent.length ? recent.map(txHTML).join('') : '<div class="empty">내역이 없어요</div>')+'</div>';
}

// ── 내역 탭 ──
function buildTxList() {
  var y=S.txYear, m=S.txMonth;
  var all = monthTxs(y,m);
  var filtered = all.filter(function(t){ return S.txFilter==='all' || t.type===S.txFilter; })
                    .sort(function(a,b){ return b.date.localeCompare(a.date); });
  var byDate = {};
  filtered.forEach(function(t){ if(!byDate[t.date]) byDate[t.date]=[]; byDate[t.date].push(t); });
  var wd=['일','월','화','수','목','금','토'];
  var groups = Object.keys(byDate).sort(function(a,b){return b.localeCompare(a);}).map(function(ds) {
    return '<div class="tx-dg"><div class="tx-dl">'+ds+' ('+wd[new Date(ds).getDay()]+'요일)</div>'
         + '<div class="tx-list">'+byDate[ds].map(txHTML).join('')+'</div></div>';
  }).join('');

  return '<div class="toolbar">'

// ── 통계 탭 ──
function buildStats() {
  var ms = thisMs();
  var mt = S.txs.filter(function(t){ return t.date && t.date.indexOf(ms)===0; });
  var exp = sumType(mt,'expense');
  var catMap = {};
  mt.filter(function(t){ return t.type==='expense'; }).forEach(function(t) {
    var c=t.category||'기타'; catMap[c]=(catMap[c]||0)+Number(t.amount||0);
  });
  var catE = Object.entries(catMap).sort(function(a,b){return b[1]-a[1];});
  var cc = ['#4263EB','#12B886','#F59F00','#FA5252','#7950F2','#1C7ED6','#F76707','#2F9E44'];
  var catBars = catE.map(function(en,i) {
    var pct = exp ? Math.round(en[1]/exp*100) : 0;
    return '<div class="bar-row"><div class="bar-lbl">'+en[0]+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:'+cc[i%cc.length]+'"></div></div><div class="bar-val">'+numFmt(en[1])+'</div></div>';
  }).join('') || '<div class="empty" style="padding:12px 0">지출 없음</div>';

  var months6 = [];
  for(var i=5;i>=0;i--) {
    var d = new Date(T.getFullYear(), T.getMonth()-i, 1);
    var ms2 = d.getFullYear()+'-'+p2(d.getMonth()+1);
    var t2 = S.txs.filter(function(t){ return t.date && t.date.indexOf(ms2)===0; });
    months6.push({l:(d.getMonth()+1)+'월', inc:sumType(t2,'income'), exp:sumType(t2,'expense')});
  }
  var maxV = Math.max.apply(null, months6.map(function(m){ return Math.max(m.inc,m.exp); }).concat([1]));
  var chart = months6.map(function(m) {
    return '<div class="mc-col">'
      + '<div class="mc-bar" style="height:'+Math.round(m.inc/maxV*80)+'px;background:var(--green);opacity:.7"></div>'
      + '<div class="mc-bar" style="height:'+Math.round(m.exp/maxV*80)+'px;background:var(--red);opacity:.7"></div>'
      + '<div class="mc-lbl">'+m.l+'</div></div>';
  }).join('');

  var cardBars = CARDS.map(function(card) {
    var amt = mt.filter(function(t){ return t.type==='expense' && t.cardId===card.id; }).reduce(function(a,t){return a+Number(t.amount||0);},0);
    var pct = exp ? Math.round(amt/exp*100) : 0;
    return '<div class="bar-row"><div class="bar-lbl">'+card.name+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:'+card.color+'"></div></div><div class="bar-val">'+numFmt(amt)+'</div></div>';
  }).join('');

  var inc = sumType(mt,'income');
  var summaryRows = [['총 수입','+'+numFmt(inc)+'원','var(--green)'],['총 지출','-'+numFmt(exp)+'원','var(--red)'],['순 잔액',numFmt(inc-exp)+'원','var(--primary)'],['거래 건수',mt.length+'건','']].map(function(r) {
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:var(--bd)"><span style="font-size:12px;color:var(--gray6)">'+r[0]+'</span><span style="font-size:13px;font-weight:700;color:'+(r[2]||'var(--gray9)')+'">'+r[1]+'</span></div>';
  }).join('');

  return '<div class="stat-grid">'
    + '<div class="stat-card"><div class="stat-title">카테고리별 지출 (이번달)</div>'+catBars+'</div>'
    + '<div class="stat-card"><div class="stat-title">최근 6개월 추이</div>'
    + '<div style="display:flex;gap:10px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gray6)"><div style="width:10px;height:10px;border-radius:2px;background:var(--green);opacity:.7"></div>수입</div><div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gray6)"><div style="width:10px;height:10px;border-radius:2px;background:var(--red);opacity:.7"></div>지출</div></div>'
    + '<div class="mc">'+chart+'</div></div>'
    + '<div class="stat-card"><div class="stat-title">카드별 지출 (이번달)</div>'+(cardBars||'<div class="empty" style="padding:10px 0">데이터 없음</div>')+'</div>'
    + '<div class="stat-card"><div class="stat-title">이번달 요약</div>'+summaryRows+'</div>'
    + '</div>';
}

  sel.innerHTML = (type==='income'?CATS.income:CATS.expense).map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');

async function saveTx(id) {
  var title = document.getElementById('tx-title').value.trim();
  var amount = document.getElementById('tx-amt').value;
  if(!title||!amount) { alert('내용과 금액을 입력해주세요'); return; }
  var tx = {id:id||'', title:title, type:txType, amount:Number(amount),
    date:document.getElementById('tx-date').value,
    category:document.getElementById('tx-cat').value,
    cardId:document.getElementById('tx-card').value,
    memo:document.getElementById('tx-memo').value||''};
  closeM();
  if(id) { S.txs = S.txs.map(function(x){ return x.id===id ? Object.assign({},x,tx) : x; }); }
  else { tx.id = Date.now().toString(); S.txs.push(tx); }
  render();
  await api('budgetSaveTx', {data:JSON.stringify(tx)});
}
async function delTx(id) {
  if(!confirm('삭제할까요?')) return;
  closeM(); S.txs = S.txs.filter(function(x){ return x.id!==id; }); render();
  await api('budgetDeleteTx', {id:id});
}

  saveLocal('budget_cards', CARDS); closeM(); renderMain();
}
function delCard(id) { if(!confirm('카드를 삭제할까요?')) return; CARDS=CARDS.filter(function(x){return x.id!==id;}); saveLocal('budget_cards',CARDS); closeM(); renderMain(); }

// ── 통장 모달 ──
function openAccountModal(id) {
  var a = id ? ACCOUNTS.find(function(x){ return x.id===id; }) : null;
  var isEdit = !!a;
  var d = a || {id:'',name:'',color:'#F59F00'};
  var dots = ACCOUNT_COLORS.map(function(col){ return '<div onclick="selAcColor(\''+col+'\')" style="width:28px;height:28px;border-radius:4px;background:'+col+';cursor:pointer;border:3px solid '+(d.color===col?'#333':'transparent')+'" id="ac-'+col.replace('#','')+'"></div>'; }).join('');
  document.getElementById('mroot').innerHTML =
    '<div class="modal-bg" onclick="if(event.target.classList.contains(\'modal-bg\'))closeM()">'
    + '<div class="modal"><div class="modal-hd"><h3>'+(isEdit?'통장 수정':'통장 추가')+'</h3></div>'
    + '<div class="modal-body">'
    + '<div><label class="fl">통장명</label><input id="ac-name" class="fi" type="text" value="'+d.name+'" placeholder="예) 국민은행, 카카오뱅크"></div>'
    + '<div><label class="fl">색상</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">'+dots+'</div><input type="hidden" id="ac-color" value="'+d.color+'"></div>'
    + '</div>'
    + '<div class="modal-ft">'+(isEdit?'<button class="btn-del" onclick="delAccount(\''+d.id+'\')">삭제</button>':'')
    + '<button class="btn-cancel" onclick="closeM()">취소</button><button class="btn-save" onclick="saveAccount(\''+(d.id||'')+'\')">저장</button></div>'
    + '</div></div>';
  setTimeout(function(){ document.getElementById('ac-name').focus(); }, 80);
}
function selAcColor(col) { document.getElementById('ac-color').value=col; ACCOUNT_COLORS.forEach(function(c){ var el=document.getElementById('ac-'+c.replace('#','')); if(el) el.style.border='3px solid '+(c===col?'#333':'transparent'); }); }
function saveAccount(id) {
  var name = document.getElementById('ac-name').value.trim();
  if(!name) { alert('통장명을 입력해주세요'); return; }
  var ac = {id:id||Date.now().toString(), name:name, color:document.getElementById('ac-color').value};
  if(id) { ACCOUNTS = ACCOUNTS.map(function(x){ return x.id===id ? ac : x; }); }
  else { ACCOUNTS.push(ac); }
  saveLocal('budget_accounts', ACCOUNTS); closeM(); renderMain();
}
function delAccount(id) { if(!confirm('통장을 삭제할까요?')) return; ACCOUNTS=ACCOUNTS.filter(function(x){return x.id!==id;}); saveLocal('budget_accounts',ACCOUNTS); closeM(); renderMain(); }

function closeM() { document.getElementById('mroot').innerHTML = ''; }

load();
</script>
</body>
</html>
