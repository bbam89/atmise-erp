<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인 가계부</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8FA;--white:#fff;
  --primary:#4263EB;--primary-l:#EEF2FF;
  --green:#12B886;--green-l:#E6FCF5;
  --red:#FA5252;--red-l:#FFF5F5;
  --amber:#F59F00;--amber-l:#FFF9DB;
  --gray1:#F1F3F5;--gray2:#E9ECEF;--gray3:#DEE2E6;
  --gray4:#CED4DA;--gray5:#ADB5BD;--gray6:#6C757D;
  --gray7:#495057;--gray8:#343A40;--gray9:#212529;
  --bd:1px solid #E9ECEF;--rad:8px;--radl:14px;
  --sh:0 1px 3px rgba(0,0,0,.06);--shl:0 4px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--gray9);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:var(--white);border-bottom:var(--bd);flex-shrink:0;box-shadow:var(--sh);position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:700;color:var(--gray9)}
.tabs{display:flex;gap:2px;background:var(--gray1);border-radius:var(--rad);padding:3px}
.tab{padding:5px 14px;border-radius:6px;font-size:13px;border:none;background:transparent;color:var(--gray6);font-weight:500;transition:all .15s;white-space:nowrap}
.tab.on{background:var(--white);color:var(--gray9);box-shadow:var(--sh)}
.topbar-r{display:flex;align-items:center;gap:10px}
.ss{font-size:11px;color:var(--gray5)}.ss.saving{color:var(--amber)}.ss.err{color:var(--red)}
.btn-add{display:flex;align-items:center;gap:5px;padding:7px 15px;border-radius:var(--rad);font-size:13px;font-weight:500;border:none;background:var(--primary);color:#fff}
.btn-add:hover{opacity:.9}

.content{flex:1;padding:20px;max-width:900px;width:100%;margin:0 auto}

.summary-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.sum-card{background:var(--white);border:var(--bd);border-radius:var(--radl);padding:16px 18px;box-shadow:var(--sh)}
.sum-label{font-size:11px;font-weight:700;color:var(--gray5);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.sum-amount{font-size:22px;font-weight:700}
.sum-sub{font-size:11px;color:var(--gray5);margin-top:3px}

.sec-title{font-size:13px;font-weight:700;color:var(--gray7);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sec-more{font-size:12px;color:var(--primary);font-weight:500;cursor:pointer;border:none;background:transparent}

.card-bills{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:20px}
.bill-card{background:var(--white);border:var(--bd);border-radius:var(--radl);padding:14px 16px;box-shadow:var(--sh)}
.bill-card-name{font-size:12px;font-weight:700;color:var(--gray6);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.bill-dot{width:8px;height:8px;border-radius:50%}
.bill-amount{font-size:20px;font-weight:700;color:var(--gray9);margin-bottom:4px}
.bill-period{font-size:11px;color:var(--gray5);margin-bottom:2px}
.dday{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:4px}
.dday.today{background:var(--red);color:#fff}
.dday.soon{background:var(--red-l);color:var(--red)}
.dday.ok{background:var(--green-l);color:var(--green)}

.fixed-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.fixed-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--white);border:var(--bd);border-radius:var(--rad);box-shadow:var(--sh);cursor:pointer}
.fixed-item:hover{border-color:var(--gray4)}
.cat-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;background:var(--gray1);color:var(--gray7)}
.paid-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.paid-y{background:var(--green-l);color:var(--green)}
.paid-n{background:var(--red-l);color:var(--red)}

.tx-list{display:flex;flex-direction:column;gap:5px}
.tx-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--white);border:var(--bd);border-radius:var(--rad);cursor:pointer;transition:border-color .15s;box-shadow:var(--sh)}
.tx-item:hover{border-color:var(--gray4)}
.tx-info{flex:1;min-width:0}
.tx-title{font-size:13px;font-weight:500;color:var(--gray8)}
.tx-meta{font-size:11px;color:var(--gray5);margin-top:1px;display:flex;gap:8px}
.tx-amount{font-size:14px;font-weight:700;white-space:nowrap}
.inc{color:var(--green)}.exp{color:var(--red)}

.tx-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mn-nav{display:flex;align-items:center;gap:6px}
.mn-nav button{background:var(--white);border:var(--bd);border-radius:var(--rad);padding:5px 10px;font-size:13px;color:var(--gray7)}
.mn-label{font-size:14px;font-weight:700;color:var(--gray9);min-width:72px;text-align:center}
.filter-btns{display:flex;gap:4px}
.fbtn{padding:5px 12px;border-radius:20px;font-size:12px;border:var(--bd);background:var(--white);color:var(--gray6);font-weight:500}
.fbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}

.tx-sum-bar{display:flex;gap:16px;padding:12px 16px;background:var(--white);border:var(--bd);border-radius:var(--rad);margin-bottom:12px;box-shadow:var(--sh)}
.tsb{font-size:12px;color:var(--gray6);display:flex;gap:6px;align-items:center}
.tsb strong{color:var(--gray9)}

.tx-date-group{margin-bottom:14px}
.tx-date-label{font-size:11px;font-weight:700;color:var(--gray5);letter-spacing:.6px;margin-bottom:6px;padding-left:2px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-card{background:var(--white);border:var(--bd);border-radius:var(--radl);padding:16px;box-shadow:var(--sh)}
.stat-card-title{font-size:11px;font-weight:700;color:var(--gray5);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--gray7);width:68px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-wrap{flex:1;height:8px;background:var(--gray2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-val{font-size:11px;color:var(--gray6);width:58px;text-align:right;flex-shrink:0}
.month-chart{display:flex;align-items:flex-end;gap:6px;height:90px}
.mc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.mc-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.mc-lbl{font-size:9px;color:var(--gray5);margin-top:3px}

.setting-section{margin-bottom:24px;max-width:520px}
.ss-title{font-size:13px;font-weight:700;color:var(--gray7);margin-bottom:10px;padding-bottom:6px;border-bottom:var(--bd)}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cat-chip{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;font-size:12px;border:var(--bd);background:var(--white);color:var(--gray7);font-weight:500}
.cat-del{background:transparent;border:none;color:var(--gray5);font-size:15px;line-height:1;padding:0 0 0 2px;cursor:pointer}
.cat-del:hover{color:var(--red)}
.cat-add-row{display:flex;gap:6px}
.card-si{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--white);border:var(--bd);border-radius:var(--rad);margin-bottom:6px;cursor:pointer;box-shadow:var(--sh)}
.card-si:hover{border-color:var(--gray4)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:var(--radl);width:100%;max-width:420px;box-shadow:var(--shl);max-height:90vh;display:flex;flex-direction:column}
.modal-hd{padding:18px 20px 14px;border-bottom:var(--bd);flex-shrink:0}
.modal-hd h3{font-size:15px;font-weight:700}
.modal-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--gray6);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:8px 10px;border:var(--bd);border-radius:var(--rad);font-size:13px;color:var(--gray8);transition:border-color .15s}
.fi:focus{outline:none;border-color:var(--primary)}
.fi::placeholder{color:var(--gray4)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-toggle{display:flex;gap:6px}
.type-btn{flex:1;padding:9px;border-radius:var(--rad);font-size:13px;font-weight:600;border:var(--bd);background:var(--white);color:var(--gray6);transition:all .15s}
.type-btn.exp.on{background:var(--red-l);border-color:var(--red);color:var(--red)}
.type-btn.inc.on{background:var(--green-l);border-color:var(--green);color:var(--green)}
.modal-ft{padding:14px 20px;border-top:var(--bd);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-shrink:0}
.btn-del{margin-right:auto;padding:7px 14px;border-radius:var(--rad);font-size:13px;border:1px solid var(--red-l);background:var(--red-l);color:var(--red);font-weight:500}
.btn-cancel{padding:7px 14px;border-radius:var(--rad);font-size:13px;border:var(--bd);background:var(--white);color:var(--gray6);font-weight:500}
.btn-save{padding:7px 18px;border-radius:var(--rad);font-size:13px;border:none;background:var(--primary);color:#fff;font-weight:600}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--primary-l);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--gray5);gap:10px}
.empty{text-align:center;padding:36px 0;color:var(--gray5);font-size:13px}
@media(max-width:768px){
  .summary-cards,.stat-grid{grid-template-columns:1fr}
  .fr2{grid-template-columns:1fr}
  .topbar{padding:0 12px}
  .tab{padding:5px 9px;font-size:11px}
  .content{padding:12px}
}
</style>
</head>
<body>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYw2mSZf3IhZ03gFZv0cpeuEB_DsC5ORtNmkEqTL8Lo2ZSgdG1vew6FEa5P4bikzQxvw/exec';
</script>

<div class="topbar">
  <div class="logo">💰 개인 가계부</div>
  <div class="tabs">
    <button class="tab on" onclick="go('home')">🏠 홈</button>
    <button class="tab" onclick="go('txlist')">📋 내역</button>
    <button class="tab" onclick="go('stats')">📊 통계</button>
    <button class="tab" onclick="go('fixed')">📌 고정지출</button>
    <button class="tab" onclick="go('settings')">⚙️ 설정</button>
  </div>
  <div class="topbar-r">
    <span class="ss" id="ss">✓ 저장됨</span>
    <button class="btn-add" onclick="openTxModal()">+ 내역추가</button>
  </div>
</div>

<div class="content" id="main">
  <div class="loading"><div class="spin"></div> 불러오는 중...</div>
</div>
<div id="mroot"></div>

<script>
const DEFAULT_CATS={expense:['식비','교통','주거','의류','문화/여가','의료','저축','기타'],income:['급여','부수입','기타수입']};
const CARD_COLORS=['#4263EB','#12B886','#F59F00','#FA5252','#7950F2','#1C7ED6'];
function loadLocal(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let CATS=loadLocal('budget_cats',DEFAULT_CATS);
let CARDS=loadLocal('budget_cards',[{id:'c1',name:'카드1',color:'#4263EB',payDay:15,cutStart:1,cutEnd:0},{id:'c2',name:'카드2',color:'#12B886',payDay:25,cutStart:1,cutEnd:0}]);

const T=new Date();
const today=fmt(T);
function fmt(d){return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function p2(n){return String(n).padStart(2,'0')}
function numFmt(n){return Number(n||0).toLocaleString()}
function korDate(ds){if(!ds)return '';const[y,m,d]=ds.split('-');return `${m}/${d}`}

let S={view:'home',txs:[],fixed:[],txYear:T.getFullYear(),txMonth:T.getMonth(),txFilter:'all'};

async function api(action,data={}){
  setSS('saving');
  try{
    const r=await fetch(SCRIPT_URL+'?payload='+encodeURIComponent(JSON.stringify({action,...data})),{method:'GET',redirect:'follow'});
    const j=await r.json();
    if(j.success!==false)setSS('ok');else setSS('err');
    return j;
  }catch(e){setSS('err');return{success:false};}
}
function setSS(s){const el=document.getElementById('ss');if(s==='saving'){el.textContent='⏳ 저장 중...';el.className='ss saving';}else if(s==='ok'){el.textContent='✓ 저장됨';el.className='ss';}else{el.textContent='⚠ 오류';el.className='ss err';}}
function normDate(v){if(!v||v==='')return '';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;try{const d=new Date(v);if(!isNaN(d))return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}catch(e){}return v;}

async function load(){
  const r=await api('budgetGetAll');
  if(r.success){
    S.txs=(r.txs||[]).map(t=>({...t,date:normDate(t.date)}));
    S.fixed=r.fixed||[];
    render();
  }else{document.getElementById('main').innerHTML='<div class="empty">⚠️ 데이터 불러오기 실패</div>';}
}

function go(v){S.view=v;document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['home','txlist','stats','fixed','settings'][i]===v));renderMain();}
function render(){renderMain();}
function renderMain(){const c=document.getElementById('main');if(S.view==='home')c.innerHTML=buildHome();else if(S.view==='txlist')c.innerHTML=buildTxList();else if(S.view==='stats')c.innerHTML=buildStats();else if(S.view==='fixed')c.innerHTML=buildFixed();else if(S.view==='settings')c.innerHTML=buildSettings();}

function thisMs(){return `${T.getFullYear()}-${p2(T.getMonth()+1)}`}
function monthTxs(y,m){return S.txs.filter(t=>t.date&&t.date.startsWith(`${y}-${p2(m+1)}`))}
function sumType(arr,type){return arr.filter(t=>t.type===type).reduce((a,t)=>a+Number(t.amount||0),0)}

function getCardBill(card){
  const y=T.getFullYear(),m=T.getMonth();
  const start=new Date(y,m-1,card.cutStart);
  const end=card.cutEnd===0?new Date(y,m+1,0):new Date(y,m-1,card.cutEnd)<start?new Date(y,m,card.cutEnd):new Date(y,m-1,card.cutEnd);
  const ss=fmt(start),es=fmt(end);
  const amount=S.txs.filter(t=>t.type==='expense'&&t.cardId===card.id&&t.date>=ss&&t.date<=es).reduce((a,t)=>a+Number(t.amount||0),0);
  let payDate=new Date(y,m,card.payDay);
  if(payDate<T)payDate=new Date(y,m+1,card.payDay);
  const diff=Math.ceil((payDate-T)/(86400000));
  return{amount,ss,es,diff};
}

function buildHome(){
  const ms=thisMs();
  const mt=S.txs.filter(t=>t.date&&t.date.startsWith(ms));
  const inc=sumType(mt,'income'),exp=sumType(mt,'expense'),bal=inc-exp;
  const bills=CARDS.map(card=>{
    const b=getCardBill(card);
    const dl=b.diff===0?'오늘 결제!':b.diff<0?`D+${Math.abs(b.diff)}`:`D-${b.diff}`;
    const dc=b.diff===0?'today':b.diff<=3?'soon':'ok';
    return `<div class="bill-card"><div class="bill-card-name"><div class="bill-dot" style="background:${card.color}"></div>${card.name}</div><div class="bill-amount">${numFmt(b.amount)}원</div><div class="bill-period">${korDate(b.ss)} ~ ${korDate(b.es)} 사용분</div><div class="bill-period">결제일 매월 ${card.payDay}일</div><span class="dday ${dc}">${dl}</span></div>`;
  }).join('');
  const soon=S.fixed.filter(f=>{const pd=`${T.getFullYear()}-${p2(T.getMonth()+1)}-${p2(f.payDay)}`;const diff=Math.ceil((new Date(pd)-T)/86400000);return diff>=-3&&diff<=7;});
  const recent=[...S.txs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return `<div class="summary-cards">
    <div class="sum-card"><div class="sum-label">이번달 수입</div><div class="sum-amount inc">+${numFmt(inc)}원</div><div class="sum-sub">${T.getMonth()+1}월</div></div>
    <div class="sum-card"><div class="sum-label">이번달 지출</div><div class="sum-amount exp">-${numFmt(exp)}원</div><div class="sum-sub">${mt.filter(t=>t.type==='expense').length}건</div></div>
    <div class="sum-card"><div class="sum-label">잔액</div><div class="sum-amount" style="color:var(--primary)">${bal>=0?'+':''}${numFmt(bal)}원</div><div class="sum-sub">${bal>=0?'흑자':'적자'}</div></div>
  </div>
  <div class="sec-title">💳 카드 청구 예정</div>
  <div class="card-bills">${bills}</div>
  ${soon.length?`<div class="sec-title">📌 곧 납부할 고정지출 <button class="sec-more" onclick="go('fixed')">전체보기</button></div><div class="fixed-list">${soon.map(f=>fixedHTML(f)).join('')}</div>`:''}
  <div class="sec-title">최근 내역 <button class="sec-more" onclick="go('txlist')">전체보기</button></div>
  <div class="tx-list">${recent.length?recent.map(txHTML).join(''):'<div class="empty">내역이 없어요</div>'}</div>`;
}

function buildTxList(){
  const y=S.txYear,m=S.txMonth;
  const all=monthTxs(y,m);
  const filtered=all.filter(t=>S.txFilter==='all'||t.type===S.txFilter).sort((a,b)=>b.date.localeCompare(a.date));
  const byDate={};filtered.forEach(t=>{if(!byDate[t.date])byDate[t.date]=[];byDate[t.date].push(t);});
  const wd=['일','월','화','수','목','금','토'];
  const groups=Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).map(ds=>`<div class="tx-date-group"><div class="tx-date-label">${ds} (${wd[new Date(ds).getDay()]}요일)</div><div class="tx-list">${byDate[ds].map(txHTML).join('')}</div></div>`).join('');
  return `<div class="tx-toolbar">
    <div class="mn-nav"><button onclick="txNav(-1)">‹</button><span class="mn-label">${y}.${p2(m+1)}</span><button onclick="txNav(1)">›</button><button onclick="txNavToday()" style="padding:5px 10px;border-radius:var(--rad);border:var(--bd);background:var(--white);font-size:12px;color:var(--gray6)">이번달</button></div>
    <div class="filter-btns"><button class="fbtn${S.txFilter==='all'?' on':''}" onclick="setTxF('all')">전체</button><button class="fbtn${S.txFilter==='income'?' on':''}" onclick="setTxF('income')">수입</button><button class="fbtn${S.txFilter==='expense'?' on':''}" onclick="setTxF('expense')">지출</button></div>
  </div>
  <div class="tx-sum-bar"><div class="tsb">수입 <strong class="inc">+${numFmt(sumType(all,'income'))}</strong></div><div class="tsb">지출 <strong class="exp">-${numFmt(sumType(all,'expense'))}</strong></div><div class="tsb">잔액 <strong>${numFmt(sumType(all,'income')-sumType(all,'expense'))}</strong></div><div class="tsb">${filtered.length}건</div></div>
  ${groups||'<div class="empty">내역이 없어요</div>'}`;
}
function txNav(d){S.txMonth+=d;if(S.txMonth>11){S.txMonth=0;S.txYear++;}if(S.txMonth<0){S.txMonth=11;S.txYear--;}renderMain();}
function txNavToday(){S.txYear=T.getFullYear();S.txMonth=T.getMonth();renderMain();}
function setTxF(f){S.txFilter=f;renderMain();}

function txHTML(t){
  const card=CARDS.find(c=>c.id===t.cardId);
  return `<div class="tx-item" onclick="openTxModal('${t.id}')">
    <span class="cat-badge">${t.type==='income'?(t.category||'수입'):(t.category||'기타')}</span>
    <div class="tx-info"><div class="tx-title">${t.title}</div><div class="tx-meta"><span>${t.date}</span>${card?`<span style="color:${card.color};font-weight:600">${card.name}</span>`:''}</div></div>
    <div class="tx-amount ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'-'}${numFmt(t.amount)}원</div>
  </div>`;
}

function buildStats(){
  const ms=thisMs();
  const mt=S.txs.filter(t=>t.date&&t.date.startsWith(ms));
  const exp=sumType(mt,'expense');
  const catMap={};mt.filter(t=>t.type==='expense').forEach(t=>{const c=t.category||'기타';catMap[c]=(catMap[c]||0)+Number(t.amount||0);});
  const catE=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const cc=['#4263EB','#12B886','#F59F00','#FA5252','#7950F2','#1C7ED6','#F76707','#2F9E44'];
  const catBars=catE.map(([cat,amt],i)=>{const pct=exp?Math.round(amt/exp*100):0;return `<div class="bar-row"><div class="bar-label">${cat}</div><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${cc[i%cc.length]}"></div></div><div class="bar-val">${numFmt(amt)}</div></div>`;}).join('')||'<div class="empty" style="padding:12px 0">지출 없음</div>';
  const months6=[];for(let i=5;i>=0;i--){const d=new Date(T.getFullYear(),T.getMonth()-i,1);const ms2=`${d.getFullYear()}-${p2(d.getMonth()+1)}`;const t2=S.txs.filter(t=>t.date&&t.date.startsWith(ms2));months6.push({l:`${d.getMonth()+1}월`,inc:sumType(t2,'income'),exp:sumType(t2,'expense')});}
  const maxV=Math.max(...months6.map(m=>Math.max(m.inc,m.exp)),1);
  const chart=months6.map(m=>`<div class="mc-col"><div class="mc-bar" style="height:${Math.round(m.inc/maxV*80)}px;background:var(--green);opacity:.7"></div><div class="mc-bar" style="height:${Math.round(m.exp/maxV*80)}px;background:var(--red);opacity:.7"></div><div class="mc-lbl">${m.l}</div></div>`).join('');
  const cardBars=CARDS.map(card=>{const amt=(mt.filter(t=>t.type==='expense'&&t.cardId===card.id).reduce((a,t)=>a+Number(t.amount||0),0));const pct=exp?Math.round(amt/exp*100):0;return `<div class="bar-row"><div class="bar-label">${card.name}</div><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${card.color}"></div></div><div class="bar-val">${numFmt(amt)}</div></div>`;}).join('');
  const inc=sumType(mt,'income');
  return `<div class="stat-grid">
    <div class="stat-card"><div class="stat-card-title">카테고리별 지출 (이번달)</div>${catBars}</div>
    <div class="stat-card"><div class="stat-card-title">최근 6개월 추이</div>
      <div style="display:flex;gap:10px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gray6)"><div style="width:10px;height:10px;border-radius:2px;background:var(--green);opacity:.7"></div>수입</div><div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gray6)"><div style="width:10px;height:10px;border-radius:2px;background:var(--red);opacity:.7"></div>지출</div></div>
      <div class="month-chart" style="display:flex;align-items:flex-end;gap:6px;height:90px">${chart}</div>
    </div>
    <div class="stat-card"><div class="stat-card-title">카드별 지출 (이번달)</div>${cardBars||'<div class="empty" style="padding:10px 0">데이터 없음</div>'}</div>
    <div class="stat-card"><div class="stat-card-title">이번달 요약</div>
      ${[['총 수입',`+${numFmt(inc)}원`,'var(--green)'],['총 지출',`-${numFmt(exp)}원`,'var(--red)'],['순 잔액',`${numFmt(inc-exp)}원`,'var(--primary)'],['거래 건수',`${mt.length}건`,'']].map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:var(--bd)"><span style="font-size:12px;color:var(--gray6)">${l}</span><span style="font-size:13px;font-weight:700;color:${c||'var(--gray9)'}">${v}</span></div>`).join('')}
    </div>
  </div>`;
}

function buildFixed(){
  return `<div class="sec-title">고정지출 관리 <button class="btn-add" onclick="openFixedModal()" style="font-size:12px;padding:5px 12px">+ 추가</button></div>
  <div style="font-size:12px;color:var(--gray5);margin-bottom:14px">매달 반복되는 지출을 등록하세요. 납부일 전후로 홈에 표시돼요.</div>
  <div class="fixed-list">${S.fixed.length?S.fixed.map(f=>fixedHTML(f,true)).join(''):'<div class="empty">등록된 고정지출이 없어요</div>'}</div>`;
}
function fixedHTML(f){
  const paid=S.txs.some(t=>t.fixedId===f.id&&t.date&&t.date.startsWith(thisMs()));
  return `<div class="fixed-item" onclick="openFixedModal('${f.id}')">
    <span class="cat-badge">${f.category||'기타'}</span>
    <div style="flex:1;font-size:13px;font-weight:500;color:var(--gray8)">${f.title}</div>
    <div style="font-size:11px;color:var(--gray5)">매월 ${f.payDay}일</div>
    <div style="font-size:13px;font-weight:700;color:var(--red)">-${numFmt(f.amount)}원</div>
    <span class="paid-badge ${paid?'paid-y':'paid-n'}">${paid?'납부완료':'미납'}</span>
  </div>`;
}

function buildSettings(){
  const expChips=CATS.expense.map((c,i)=>`<div class="cat-chip">${c}<button class="cat-del" onclick="delCat('expense',${i})">×</button></div>`).join('');
  const incChips=CATS.income.map((c,i)=>`<div class="cat-chip">${c}<button class="cat-del" onclick="delCat('income',${i})">×</button></div>`).join('');
  const cardItems=CARDS.map(c=>`<div class="card-si" onclick="openCardModal('${c.id}')"><div style="width:12px;height:12px;border-radius:50%;background:${c.color};flex-shrink:0"></div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--gray8)">${c.name}</div><div style="font-size:11px;color:var(--gray5)">결제일 ${c.payDay}일 · 사용기간 ${c.cutStart}일~${c.cutEnd||'말일'}</div></div></div>`).join('');
  return `<div style="max-width:520px">
    <div class="setting-section"><div class="ss-title">💳 카드 관리</div>${cardItems}<button onclick="openCardModal()" style="margin-top:8px;width:100%;padding:9px;border-radius:var(--rad);border:1.5px dashed var(--gray4);background:transparent;color:var(--gray6);font-size:13px">+ 카드 추가</button></div>
    <div class="setting-section"><div class="ss-title">🏷 지출 카테고리</div><div class="cat-grid">${expChips}</div><div class="cat-add-row"><input id="nec" class="fi" type="text" placeholder="새 카테고리" style="flex:1"><button onclick="addCat('expense')" style="padding:7px 14px;border-radius:var(--rad);border:none;background:var(--primary);color:#fff;font-size:13px">추가</button></div></div>
    <div class="setting-section"><div class="ss-title">💵 수입 카테고리</div><div class="cat-grid">${incChips}</div><div class="cat-add-row"><input id="nic" class="fi" type="text" placeholder="새 카테고리" style="flex:1"><button onclick="addCat('income')" style="padding:7px 14px;border-radius:var(--rad);border:none;background:var(--green);color:#fff;font-size:13px">추가</button></div></div>
  </div>`;
}
function addCat(type){const id=type==='expense'?'nec':'nic';const v=document.getElementById(id).value.trim();if(!v||CATS[type].includes(v))return;CATS[type].push(v);saveLocal('budget_cats',CATS);renderMain();}
function delCat(type,idx){if(!confirm(`"${CATS[type][idx]}" 삭제할까요?`))return;CATS[type].splice(idx,1);saveLocal('budget_cats',CATS);renderMain();}

let txType='expense';
function openTxModal(id){
  const t=id?S.txs.find(x=>x.id===id):null;
  txType=t?t.type:'expense';
  const isEdit=!!t;
  const d=t||{id:'',title:'',type:'expense',amount:'',date:today,category:'식비',cardId:CARDS[0]?.id||'',memo:''};
  document.getElementById('mroot').innerHTML=`<div class="modal-bg" onclick="if(event.target.classList.contains('modal-bg'))closeM()"><div class="modal">
    <div class="modal-hd"><h3>${isEdit?'내역 수정':'내역 추가'}</h3></div>
    <div class="modal-body">
      <div><label class="fl">유형</label><div class="type-toggle"><button class="type-btn exp${txType==='expense'?' on':''}" id="bexp" onclick="setTxType('expense')">지출</button><button class="type-btn inc${txType==='income'?' on':''}" id="binc" onclick="setTxType('income')">수입</button></div></div>
      <div><label class="fl">내용</label><input id="tx-title" class="fi" type="text" value="${d.title}" placeholder="예) 점심식사, 월급"></div>
      <div class="fr2"><div><label class="fl">금액 (원)</label><input id="tx-amt" class="fi" type="number" value="${d.amount}" placeholder="0"></div><div><label class="fl">날짜</label><input id="tx-date" class="fi" type="date" value="${d.date}"></div></div>
      <div id="tx-cat-wrap"><label class="fl">카테고리</label><select id="tx-cat" class="fi">${(txType==='income'?CATS.income:CATS.expense).map(c=>`<option value="${c}"${d.category===c?' selected':''}>${c}</option>`).join('')}</select></div>
      <div><label class="fl">결제수단</label><select id="tx-card" class="fi"><option value="">현금</option>${CARDS.map(c=>`<option value="${c.id}"${d.cardId===c.id?' selected':''}>${c.name}</option>`).join('')}</select></div>
      <div><label class="fl">메모</label><input id="tx-memo" class="fi" type="text" value="${d.memo||''}" placeholder="선택사항"></div>
    </div>
    <div class="modal-ft">${isEdit?`<button class="btn-del" onclick="delTx('${d.id}')">삭제</button>`:''}<button class="btn-cancel" onclick="closeM()">취소</button><button class="btn-save" onclick="saveTx('${d.id||''}')">저장</button></div>
  </div></div>`;
  setTimeout(()=>document.getElementById('tx-title').focus(),80);
}
function setTxType(type){txType=type;document.getElementById('bexp').className=`type-btn exp${type==='expense'?' on':''}`;document.getElementById('binc').className=`type-btn inc${type==='income'?' on':''}`;const sel=document.getElementById('tx-cat');sel.innerHTML=(type==='income'?CATS.income:CATS.expense).map(c=>`<option value="${c}">${c}</option>`).join('');}
async function saveTx(id){const title=document.getElementById('tx-title').value.trim();const amount=document.getElementById('tx-amt').value;if(!title||!amount){alert('내용과 금액을 입력해주세요');return;}const tx={id:id||'',title,type:txType,amount:Number(amount),date:document.getElementById('tx-date').value,category:document.getElementById('tx-cat').value,cardId:document.getElementById('tx-card').value,memo:document.getElementById('tx-memo').value||''};closeM();if(id){S.txs=S.txs.map(x=>x.id===id?{...x,...tx}:x);}else{tx.id=Date.now().toString();S.txs.push(tx);}render();await api('budgetSaveTx',{data:JSON.stringify(tx)});}
async function delTx(id){if(!confirm('삭제할까요?'))return;closeM();S.txs=S.txs.filter(x=>x.id!==id);render();await api('budgetDeleteTx',{id});}

function openFixedModal(id){
  const f=id?S.fixed.find(x=>x.id===id):null;
  const isEdit=!!f;
  const d=f||{id:'',title:'',category:'주거',amount:'',payDay:1,memo:''};
  document.getElementById('mroot').innerHTML=`<div class="modal-bg" onclick="if(event.target.classList.contains('modal-bg'))closeM()"><div class="modal">
    <div class="modal-hd"><h3>${isEdit?'고정지출 수정':'고정지출 추가'}</h3></div>
    <div class="modal-body">
      <div><label class="fl">항목명</label><input id="fx-title" class="fi" type="text" value="${d.title}" placeholder="예) 월세, 보험료, 구독료"></div>
      <div class="fr2"><div><label class="fl">금액 (원)</label><input id="fx-amt" class="fi" type="number" value="${d.amount}"></div><div><label class="fl">납부일 (매월)</label><input id="fx-day" class="fi" type="number" min="1" max="31" value="${d.payDay}"></div></div>
      <div><label class="fl">카테고리</label><select id="fx-cat" class="fi">${CATS.expense.map(c=>`<option value="${c}"${d.category===c?' selected':''}>${c}</option>`).join('')}</select></div>
      <div><label class="fl">메모</label><input id="fx-memo" class="fi" type="text" value="${d.memo||''}"></div>
    </div>
    <div class="modal-ft">${isEdit?`<button class="btn-del" onclick="delFixed('${d.id}')">삭제</button>`:''}<button class="btn-cancel" onclick="closeM()">취소</button><button class="btn-save" onclick="saveFixed('${d.id||''}')">저장</button></div>
  </div></div>`;
  setTimeout(()=>document.getElementById('fx-title').focus(),80);
}
async function saveFixed(id){const title=document.getElementById('fx-title').value.trim();const amount=document.getElementById('fx-amt').value;if(!title||!amount){alert('항목명과 금액을 입력해주세요');return;}const f={id:id||'',title,amount:Number(amount),payDay:Number(document.getElementById('fx-day').value),category:document.getElementById('fx-cat').value,memo:document.getElementById('fx-memo').value||''};closeM();if(id){S.fixed=S.fixed.map(x=>x.id===id?{...x,...f}:x);}else{f.id=Date.now().toString();S.fixed.push(f);}render();await api('budgetSaveFixed',{data:JSON.stringify(f)});}
async function delFixed(id){if(!confirm('삭제할까요?'))return;closeM();S.fixed=S.fixed.filter(x=>x.id!==id);render();await api('budgetDeleteFixed',{id});}

function openCardModal(id){
  const c=id?CARDS.find(x=>x.id===id):null;
  const isEdit=!!c;
  const d=c||{id:'',name:'',color:'#4263EB',payDay:15,cutStart:1,cutEnd:0};
  document.getElementById('mroot').innerHTML=`<div class="modal-bg" onclick="if(event.target.classList.contains('modal-bg'))closeM()"><div class="modal">
    <div class="modal-hd"><h3>${isEdit?'카드 수정':'카드 추가'}</h3></div>
    <div class="modal-body">
      <div><label class="fl">카드명</label><input id="cd-name" class="fi" type="text" value="${d.name}" placeholder="예) 삼성카드, 신한카드"></div>
      <div><label class="fl">카드 색상</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${CARD_COLORS.map(col=>`<div onclick="selColor('${col}')" style="width:28px;height:28px;border-radius:50%;background:${col};cursor:pointer;border:3px solid ${d.color===col?'#333':'transparent'}" id="cc-${col.replace('#','')}"></div>`).join('')}</div><input type="hidden" id="cd-color" value="${d.color}"></div>
      <div class="fr2"><div><label class="fl">결제일 (매월)</label><input id="cd-pd" class="fi" type="number" min="1" max="31" value="${d.payDay}"></div><div><label class="fl">사용기간 시작일</label><input id="cd-cs" class="fi" type="number" min="1" max="31" value="${d.cutStart}"></div></div>
      <div><label class="fl">사용기간 종료일 (0=말일)</label><input id="cd-ce" class="fi" type="number" min="0" max="31" value="${d.cutEnd}"></div>
      <div style="font-size:11px;color:var(--gray5);background:var(--gray1);padding:8px 10px;border-radius:var(--rad)">예) 시작 1일, 종료 0(말일), 결제일 15일 → 전월 1일~말일 사용분이 당월 15일 출금</div>
    </div>
    <div class="modal-ft">${isEdit?`<button class="btn-del" onclick="delCard('${d.id}')">삭제</button>`:''}<button class="btn-cancel" onclick="closeM()">취소</button><button class="btn-save" onclick="saveCard('${d.id||''}')">저장</button></div>
  </div></div>`;
}
function selColor(col){document.getElementById('cd-color').value=col;CARD_COLORS.forEach(c=>{const el=document.getElementById('cc-'+c.replace('#',''));if(el)el.style.border=`3px solid ${c===col?'#333':'transparent'}`;});}
function saveCard(id){const name=document.getElementById('cd-name').value.trim();if(!name){alert('카드명을 입력해주세요');return;}const card={id:id||Date.now().toString(),name,color:document.getElementById('cd-color').value,payDay:Number(document.getElementById('cd-pd').value),cutStart:Number(document.getElementById('cd-cs').value),cutEnd:Number(document.getElementById('cd-ce').value)};if(id){CARDS=CARDS.map(x=>x.id===id?card:x);}else{CARDS.push(card);}saveLocal('budget_cards',CARDS);closeM();renderMain();}
function delCard(id){if(!confirm('카드를 삭제할까요?'))return;CARDS=CARDS.filter(x=>x.id!==id);saveLocal('budget_cards',CARDS);closeM();renderMain();}
function closeM(){document.getElementById('mroot').innerHTML='';}

load();
</script>
</body>
</html>
